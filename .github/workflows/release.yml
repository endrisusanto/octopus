name: Release Octopus Suite

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump type
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: Custom version (e.g. 1.0.5)
        required: false
        type: string
  push:
    tags:
      - 'v*'

jobs:
  create-release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.vars.outputs.tag_name }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version & tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${{ github.ref_name }}"
            VER="${TAG#v}"
          else
            VER="${{ inputs.version || '1.0.0' }}"
            TAG="v${VER}"
          fi
          echo "tag_name=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VER}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release Draft
        uses: softprops/action-gh-release@v2
        with:
          name: "Octopus ${{ steps.vars.outputs.tag_name }}"
          tag_name: ${{ steps.vars.outputs.tag_name }}
          generate_release_notes: true
          draft: false
          prerelease: false

  build-linux:
    needs: create-release
    permissions:
      contents: write
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libudev-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Build Web Client & Hub Server
        run: |
          cd web-hub/client && npm install && npm run build
          cd ../server && npm install && npm run build

      - name: Build Direct Linux Deb & Binary
        run: |
          chmod +x ./build-deb.sh
          ./build-deb.sh

      - name: Stage Direct Linux Installers & Generate .sig
        run: |
          VER="${{ needs.create-release.outputs.version }}"
          TAG="${{ needs.create-release.outputs.tag_name }}"
          
          mkdir -p release_artifacts
          
          # Copy standalone direct binary
          cp agent-bridge/target/release/octopus-agent-bridge "release_artifacts/octopus-agent-bridge-${TAG}-linux-x86_64"
          
          # Copy .deb installer built by build-deb.sh
          cp dist/*.deb release_artifacts/
          
          # Generate .sig checksums for all installer files
          cd release_artifacts
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sig ]]; then
              sha256sum "$f" | awk '{print $1}' > "${f}.sig"
            fi
          done

      - name: Upload Linux Direct Installers to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: release_artifacts/*

  build-windows:
    needs: create-release
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build Direct Windows NSIS Installer & Binary
        working-directory: ./agent-bridge
        run: |
          npx -y @tauri-apps/cli build --bundles nsis || cargo build --release

      - name: Stage Direct Windows Installers & Generate .sig
        shell: bash
        run: |
          TAG="${{ needs.create-release.outputs.tag_name }}"
          
          mkdir -p release_win_artifacts
          
          # Copy standalone direct executable .exe
          cp agent-bridge/target/release/octopus-agent-bridge.exe "release_win_artifacts/octopus-agent-bridge-${TAG}-windows-x86_64.exe"
          
          # Copy NSIS Setup .exe installer if built
          find agent-bridge/target/release/bundle/nsis -name "*.exe" -exec cp {} release_win_artifacts/ \; 2>/dev/null || true

          # Generate .sig checksums for all windows installer files
          cd release_win_artifacts
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != *.sig ]]; then
              sha256sum "$f" | awk '{print $1}' > "${f}.sig"
            fi
          done

      - name: Upload Windows Direct Installers to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: release_win_artifacts/*

  generate-updater-manifest:
    needs:
      - create-release
      - build-linux
      - build-windows
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate latest.json updater manifest for direct installers
        run: |
          TAG="${{ needs.create-release.outputs.tag_name }}"
          VER="${{ needs.create-release.outputs.version }}"
          DATE="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          REPO="endrisusanto/octopus"
          
          cat <<EOF > latest.json
          {
            "version": "${TAG}",
            "notes": "Octopus automated release ${TAG}",
            "pub_date": "${DATE}",
            "platforms": {
              "linux-x86_64": {
                "signature": "",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/octopus-agent-bridge-${TAG}-linux-x86_64"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "https://github.com/${REPO}/releases/download/${TAG}/octopus-agent-bridge-${TAG}-windows-x86_64.exe"
              }
            }
          }
          EOF

      - name: Upload latest.json to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag_name }}
          files: latest.json
