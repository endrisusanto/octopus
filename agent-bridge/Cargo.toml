[package]
name = "octopus-agent-bridge"
version = "1.0.27"
edition = "2021"
description = "Lightweight Rust Agent Bridge for Octopus Distributed Web Hub"

[dependencies]
tokio = { version = "1.38", features = ["full"] }
tokio-tungstenite = { version = "0.23", features = ["connect"] }
futures-util = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
url = "2.5"
hostname = "0.4"
tauri = { version = "2", features = ["tray-icon"] }
open = "5.3"
md5 = "0.7"
serialport = "4.3.0"
rfd = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

