<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Octopus Agent Bridge</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0d1117; color: #f0f6fc; padding: 1.25rem; display: flex; flex-direction: column; gap: 0.85rem; min-height: 100vh; user-select: none; }
    .header { display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #30363d; padding-bottom: 0.75rem; }
    .title { font-size: 1.1rem; font-weight: 700; color: #58a6ff; letter-spacing: 0.03em; }
    .status-badge { font-size: 0.75rem; font-weight: 700; padding: 0.25rem 0.6rem; border-radius: 4px; transition: all 0.2s; }
    .status-online { background: #122619; color: #3fb950; border: 1px solid #238636; }
    .status-offline { background: #2a1215; color: #f85149; border: 1px solid #da3633; }
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 0.85rem; display: flex; flex-direction: column; gap: 0.6rem; }
    .input-row { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; font-size: 0.825rem; }
    .label { color: #8b949e; font-weight: 600; min-width: 110px; }
    .input-control { flex: 1; background: #0d1117; border: 1px solid #30363d; color: #f0f6fc; padding: 0.35rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-family: monospace; outline: none; }
    .input-control:focus { border-color: #58a6ff; }
    .btn { display: inline-flex; align-items: center; justify-content: center; background: #21262d; border: 1px solid #30363d; color: #f0f6fc; padding: 0.35rem 0.75rem; border-radius: 6px; font-weight: 600; font-size: 0.8rem; cursor: pointer; text-decoration: none; transition: background 0.15s; }
    .btn:hover { background: #30363d; }
    .btn-primary { background: #1f6feb; border-color: #1f6feb; }
    .btn-primary:hover { background: #388bfd; }
    .device-list { max-height: 120px; overflow-y: auto; display: flex; flex-direction: column; gap: 0.3rem; margin-top: 0.25rem; }
    .device-item { display: flex; justify-content: space-between; align-items: center; background: #0d1117; padding: 0.35rem 0.5rem; border-radius: 4px; font-size: 0.75rem; border: 1px solid #21262d; }
    .alert { background: #1f242c; border: 1px solid #388bfd; color: #8b949e; font-size: 0.725rem; padding: 0.5rem; border-radius: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div style="display: flex; align-items: center; gap: 0.65rem;">
      <img src="app-logo.png" alt="Logo" style="width: 32px; height: 32px; border-radius: 6px;">
      <div class="title">OCTOPUS AGENT BRIDGE</div>
    </div>
    <div class="status-badge status-offline" id="status-badge">CONNECTING...</div>
  </div>

  <div class="card">
    <div class="input-row">
      <span class="label">Workstation ID:</span>
      <input type="text" id="pc-id-input" class="input-control" placeholder="UBUNTU-WORKSTATION">
      <button onclick="handleSaveConfig()" class="btn" id="btn-save-pc" style="padding: 0.35rem 0.5rem;">Simpan</button>
    </div>

    <div class="input-row">
      <span class="label">Hub Server URL:</span>
      <input type="text" id="hub-url-input" class="input-control" placeholder="ws://127.0.0.1:4000/ws/bridge">
      <button onclick="handleSaveConfig()" class="btn" id="btn-save-hub" style="padding: 0.35rem 0.5rem;">Simpan</button>
    </div>

    <div class="input-row" style="margin-top: 0.25rem; border-top: 1px solid #21262d; padding-top: 0.4rem;">
      <span class="label">Connected Devices:</span>
      <span id="device-count-label" style="font-weight: 700; color: #58a6ff; font-family: monospace;">0 Devices Detected</span>
    </div>

    <div class="device-list" id="device-list-container">
      <div style="color: #8b949e; font-size: 0.75rem; text-align: center; padding: 0.5rem;">Scanning USB & ADB devices...</div>
    </div>
  </div>

  <div class="alert">
    <strong>Background Tray Active:</strong> Bridge tetap aktif saat jendela di-close. Akses kembali lewat icon System Tray.
  </div>

  <div style="display: flex; gap: 0.5rem; margin-top: auto;">
    <a href="https://octopus.endrisusanto.my.id" target="_blank" class="btn btn-primary" style="flex: 1;">Buka Web Hub</a>
    <button onclick="window.__TAURI__.window.getCurrentWindow().hide()" class="btn">Minimize ke Tray</button>
  </div>

  <script>
    const invoke = window.__TAURI__ ? window.__TAURI__.core.invoke : null;
    let isEditingPc = false;
    let isEditingHub = false;

    document.getElementById('pc-id-input').addEventListener('focus', () => { isEditingPc = true; });
    document.getElementById('hub-url-input').addEventListener('focus', () => { isEditingHub = true; });

    async function fetchLiveStatus() {
      if (!invoke) return;
      try {
        const st = await invoke('get_bridge_status');
        
        // Update status badge
        const badge = document.getElementById('status-badge');
        if (st.is_connected) {
          badge.className = 'status-badge status-online';
          badge.innerText = 'ONLINE';
        } else {
          badge.className = 'status-badge status-offline';
          badge.innerText = 'DISCONNECTED';
        }

        // Update inputs if not currently focused
        if (!isEditingPc) {
          document.getElementById('pc-id-input').value = st.pc_id;
        }
        if (!isEditingHub) {
          document.getElementById('hub-url-input').value = st.hub_url;
        }

        // Update devices count & list
        document.getElementById('device-count-label').innerText = `${st.device_count} Devices Detected`;
        
        const listContainer = document.getElementById('device-list-container');
        if (st.devices && st.devices.length > 0) {
          listContainer.innerHTML = st.devices.map(d => `
            <div class="device-item">
              <div>
                <strong style="color: #f0f6fc;">${d.model}</strong>
                <span style="color: #8b949e; font-size: 0.7rem; margin-left: 0.3rem;">[${d.port}]</span>
              </div>
              <span style="color: ${d.mode === 'odin' ? '#58a6ff' : '#3fb950'}; font-weight: 600; text-transform: uppercase;">${d.mode}</span>
            </div>
          `).join('');
        } else {
          listContainer.innerHTML = '<div style="color: #8b949e; font-size: 0.75rem; text-align: center; padding: 0.4rem;">Tidak ada USB device terdeteksi.</div>';
        }
      } catch (err) {
        console.error('Status fetch error:', err);
      }
    }

    async function handleSaveConfig() {
      if (!invoke) return;
      const pcId = document.getElementById('pc-id-input').value;
      const hubUrl = document.getElementById('hub-url-input').value;
      
      try {
        await invoke('save_bridge_config', { pcId, hubUrl });
        isEditingPc = false;
        isEditingHub = false;
        document.getElementById('pc-id-input').blur();
        document.getElementById('hub-url-input').blur();
        fetchLiveStatus();
      } catch (err) {
        alert('Gagal menyimpan config: ' + err);
      }
    }

    // Poll live status every 1 second
    setInterval(fetchLiveStatus, 1000);
    document.addEventListener('DOMContentLoaded', fetchLiveStatus);
  </script>
</body>
</html>
